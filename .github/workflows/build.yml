name: Windows installer

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

env:
  PYTHONUTF8: "1"

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install -r requirements.txt
          python -m pip install --no-build-isolation -r requirements-madmom.txt
          python -c "import madmom, soundfile, av, PySide6, sounddevice; print('madmom', madmom.__version__, 'libsndfile', soundfile.__libsndfile_version__)"

      - name: Test licence
        run: python tests/test_license.py

      - name: Test engine from source
        run: python tests/test_engine.py python engine/click_engine.py

      - name: Build app (PyInstaller)
        run: pyinstaller --noconfirm --clean ClickStudio.spec

      - name: Test the built engine
        shell: pwsh
        run: |
          python tests/test_engine.py "dist/Click Studio/click_engine.exe"
          $r = Start-Process -FilePath "dist/Click Studio/Click Studio.exe" -ArgumentList "--machine-code" -Wait -PassThru -NoNewWindow -RedirectStandardOutput code.txt
          Get-Content code.txt
          if ((Get-Content code.txt) -notmatch '^[0-9A-F]{4}-[0-9A-F]{4}-[0-9A-F]{4}-[0-9A-F]{4}$') { throw "machine code" }
          $r = Start-Process -FilePath "dist/Click Studio/Click Studio.exe" -ArgumentList "--check-license","a@b.c","AAAA" -Wait -PassThru -NoNewWindow -RedirectStandardOutput chk.txt
          if ($r.ExitCode -ne 1) { throw "a junk key must be rejected" }

      - name: Build installer (Inno Setup)
        shell: pwsh
        run: |
          $v = if ("${{ github.ref_type }}" -eq "tag") { "${{ github.ref_name }}".TrimStart("v") } else { "1.0.${{ github.run_number }}" }
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup -y --no-progress; }
          & $iscc "/DAppVersion=$v" installer\ClickStudio.iss
          if ($LASTEXITCODE -ne 0) { throw "iscc failed" }
          Get-ChildItem dist\*.exe | Format-Table Name, Length

      - name: Silent install and run the installed engine
        shell: pwsh
        run: |
          $setup = (Get-ChildItem dist\ClickStudio-Setup-*.exe)[0].FullName
          Start-Process -FilePath $setup -ArgumentList "/VERYSILENT","/SUPPRESSMSGBOXES","/NORESTART","/CURRENTUSER","/DIR=$env:RUNNER_TEMP\cs" -Wait
          python tests/test_engine.py "$env:RUNNER_TEMP\cs\click_engine.exe"

      - uses: actions/upload-artifact@v4
        with:
          name: ClickStudio-Setup
          path: dist/ClickStudio-Setup-*.exe
          retention-days: 30

      - name: Publish release
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v2
        with:
          files: dist/ClickStudio-Setup-*.exe
